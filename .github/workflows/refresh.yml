name: 24h Auto Refresh

on:
  schedule:
    - cron: '0 0 * * *'   # هەر ڕۆژێک کاتژمێر 00:00 UTC
  workflow_dispatch:       # بتوانیت دەستی بکەیت بە دەست

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Modify plist files (trigger change)
        run: |
          shopt -s nullglob
          for file in *.plist; do
            echo "" >> "$file"
          done

      - name: Commit & Push if changed
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          git add .
          git diff --cached --quiet || git commit -m "🔄 Auto refresh $(date -u)"
          git push
