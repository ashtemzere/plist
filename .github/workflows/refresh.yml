name: Auto Refresh Every Hour

on:
  schedule:
    - cron: '0 * * * *'  # هەموو کاتژمێرێک
  workflow_dispatch:      # دەستی

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # ئەمە زۆر گرنگە!

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update plist files
        run: |
          echo "🔄 نوێکردنەوەی فایلەکان..."
          for file in *.plist; do
            if [ -f "$file" ]; then
              echo "" >> "$file"
              echo "✅ $file نوێکرایەوە"
            fi
          done

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions@github.com"
          
          git add -A
          if git diff --staged --quiet; then
            echo "📭 هیچ گۆڕانکاریەک نییە"
          else
            git commit -m "🔄 Auto refresh $(date +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "🚀 سەرکەوتوو! گۆڕانکاریەکان نێردران"
          fi
