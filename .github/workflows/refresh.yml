name: هەموو 1 کاتژمێرێک

on:
  schedule:
    - cron: '0 * * * *'   # هەموو کاتژمێرێک
  workflow_dispatch:       # دەستی

jobs:
  نوێکردنەوە:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # گرنگترین بەشی کۆدەکە!

    steps:
      - name: هێنانەوەی کۆد
        uses: actions/checkout@v4

      - name: نوێکردنی فایلەکان
        run: |
          echo "📝 نوێکردنەوە..."
          for file in *.plist; do
            echo "   🔄 $file"
            echo "" >> "$file"
          done

      - name: ناردنی گۆڕانکاریەکان
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          git add .
          
          if git diff --cached --quiet; then
            echo "✅ هیچ گۆڕانکاریەک نییە"
          else
            git commit -m "🔄 نوێکردنەوە $(date '+%H:%M')"
            git push
            echo "✅ سەرکەوتوو بوون!"
          fi
