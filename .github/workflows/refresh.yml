name: هەموو 1 کاتژمێرێک

on:
  schedule:
    - cron: '0 * * * *'  # هەموو کاتژمێرێک لە دەقیقەی 0دا
  workflow_dispatch:      # دەستی

jobs:
  نوێکردن:
    runs-on: ubuntu-latest

    steps:
      # 1. هێنانەوەی کۆد
      - uses: actions/checkout@v4
      
      # 2. نوێکردنی فایلەکان
      - name: نوێکردن
        run: |
          for f in *.plist; do
            [ -f "$f" ] && echo "" >> "$f"
          done
      
      # 3. ناردنی گۆڕانکاریەکان
      - name: ناردن
        run: |
          git config user.name "Auto Bot"
          git config user.email "bot@github.com"
          
          git add .
          git diff --cached --quiet || {
            git commit -m "🔄 نوێکردنەوە $(date +%H:%M)"
            git push
          }
